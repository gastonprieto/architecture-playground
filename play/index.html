<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before the first paint (store/theme.ts keeps it in sync afterwards). -->
    <script>
      try {
        var t = localStorage.getItem('nodarium:theme')
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Nodarium · Playground</title>
    <meta name="description" content="Canvas para diseñar una arquitectura y simular cómo circulan requests, mensajes y eventos entre servicios, colas y bases de datos." />
    <link rel="canonical" href="https://nodarium.shichi.app/play" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
